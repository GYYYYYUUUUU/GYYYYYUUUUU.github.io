---
layout: default
---

<div class="post-container">

  <a class="back-link" href="/notes/">← Notes</a>

  <article class="post">

    <header class="post-header">
      <h1>{{ page.title }}</h1>

      <div class="post-date">
        {{ page.date | date: "%B %-d, %Y" }}
      </div>

      {% if page.description %}
      <p class="post-description">
        {{ page.description }}
      </p>
      {% endif %}
    </header>

    <div class="post-content">
      {{ content }}
    </div>

  </article>

</div>
